<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Nuevo Curso</title>
</head>
<body>
    <h1>Agregar Curso</h1>

        {% csrf_token %}
        {{ form.as_p }}

    <a href="{% url 'lista_notas' %}">Regresar a la lista</a>
</body>
</html>
